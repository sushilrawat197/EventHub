name: Build & Deploy MyTag

on:
  push:
    branches:
      - main
      - staging

jobs:
  deploy-production:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, mytagprod]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create env file
        run: |
          printf '%s\n' 'VITE_BASE_URL=https://www.mytag.co.ls' > .env

      - name: Install dependencies
        run: npm ci

      # env: wins over any VITE_* already set on the self-hosted runner
      - name: Build React App
        env:
          VITE_BASE_URL: https://www.mytag.co.ls
        run: npm run build

      - name: Remove old dist
        run: |
          rm -rf /var/www/html/mytagfrontend/dist

      - name: Deploy
        run: |
          mkdir -p /var/www/html/mytagfrontend
          cp -r dist /var/www/html/mytagfrontend

  deploy-staging:
    if: github.ref == 'refs/heads/staging'
    runs-on: [self-hosted, mytag]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create env file
        run: |
          printf '%s\n' 'VITE_BASE_URL=https://esyrecharge.com' > .env
          printf '%s\n' 'VITE_APP_BASE=/mytag' >> .env

      - name: Install dependencies
        run: npm ci

      - name: Build React App
        env:
          VITE_BASE_URL: https://esyrecharge.com
          VITE_APP_BASE: /mytag
        run: npm run build

      - name: Remove old dist
        run: |
           rm -rf /var/www/html/mytag/dist

      - name: Deploy
        run: |
           mkdir -p /var/www/html/mytag
           cp -r dist /var/www/html/mytag
