name: Build & Deploy MyTag

on:
  push:
    branches:
      - main
      - staging

jobs:
  deploy-production:
    if: github.ref == 'refs/heads/main'
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Build React App
        run: npm run build

      - name: Remove old dist
        run: |
          rm -rf /var/www/html/mytagfrontend/dist

      - name: Deploy
        run: |
          mkdir -p /var/www/html/mytagfrontend
          cp -r dist /var/www/html/mytagfrontend

  deploy-staging:
    if: github.ref == 'refs/heads/staging'
    runs-on: [self-hosted, mytag]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create env file
        run: |
          echo 'VITE_BASE_URL=https://esyrecharge.com/ticketcore-api/api/v1' > .env
          echo 'VITE_APP_BASE=/mytag' >> .env

      - name: Install dependencies
        run: npm ci

      - name: Build React App
        run: npm run build

      - name: Remove old dist
        run: |
           rm -rf /var/www/html/mytag/dist

      - name: Deploy
        run: |
           mkdir -p /var/www/html/mytag
           cp -r dist /var/www/html/mytag
